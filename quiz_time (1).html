<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Time - At the Zoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand-light:#f6dfae;
    --sand:#e9c48a;
    --sand-dark:#c98f52;
    --sea-light:#aee4f7;
    --sea:#3fc1e9;
    --sea-deep:#1fa2d8;
    --coral:#f0645a;
    --coral-dark:#d84a41;
    --map:#f6e9bd;
    --map-line:#e2c98a;
    --ink:#7a4a24;
    --ink-soft:#9a6a3d;
    --shell-purple:#a89bd0;
    --good:#4fae6b;
    --bad:#e2645a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Fredoka',sans-serif;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(255,255,255,0.25), transparent 40%),
      linear-gradient(180deg, var(--sand-light) 0%, var(--sand) 55%, var(--sea-light) 55%, var(--sea) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    position:relative;
  }
  .bg-dot{position:absolute;border-radius:50%;background:rgba(255,255,255,0.55);}
  .stage{
    width:100%;
    max-width:560px;
    position:relative;
    z-index:2;
  }
  .card{
    position:relative;
    background:var(--map);
    border-radius:26px;
    padding:44px 34px 38px;
    box-shadow:0 18px 0 var(--sand-dark), 0 24px 40px rgba(90,50,10,0.25);
    text-align:center;
    min-height:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    animation:pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  .card::before{
    content:"";
    position:absolute; inset:14px;
    border:2px dashed var(--map-line);
    border-radius:16px;
    pointer-events:none;
    opacity:.6;
  }
  @keyframes pop{
    0%{opacity:0; transform:scale(.85) translateY(20px);}
    100%{opacity:1; transform:scale(1) translateY(0);}
  }
  .badge{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    background:var(--coral);
    color:#fff;
    padding:10px 26px;
    border-radius:30px;
    font-size:15px;
    letter-spacing:1px;
    text-transform:uppercase;
    box-shadow:0 5px 0 var(--coral-dark);
    margin-bottom:22px;
  }
  .progress-wrap{
    width:100%;
    display:flex;
    gap:6px;
    margin-bottom:20px;
  }
  .progress-seg{
    flex:1;
    height:8px;
    border-radius:5px;
    background:rgba(122,74,36,0.15);
    overflow:hidden;
  }
  .progress-seg.filled{background:var(--coral);}
  h1.title{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    color:var(--sand-dark);
    -webkit-text-stroke:2px var(--sand-dark);
    font-size:56px;
    line-height:1;
    margin:0 0 8px;
    text-shadow:0 4px 0 rgba(90,50,10,0.15);
  }
  .subtitle{
    font-size:20px;
    color:var(--ink-soft);
    margin:0 0 26px;
    font-weight:500;
  }
  .emojis{font-size:30px; margin-bottom:10px; letter-spacing:4px;}
  .btn{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:19px;
    color:#fff;
    background:var(--coral);
    border:none;
    padding:16px 46px;
    border-radius:40px;
    cursor:pointer;
    box-shadow:0 6px 0 var(--coral-dark);
    transition:transform .12s ease;
    letter-spacing:.5px;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--coral-dark);}
  .btn:hover{filter:brightness(1.05);}
  .btn.secondary{
    background:var(--sand-light);
    color:var(--sand-dark);
    box-shadow:0 6px 0 var(--sand-dark);
  }
  .q-text{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    color:var(--coral);
    font-size:27px;
    line-height:1.3;
    margin:0 0 28px;
    padding:0 4px;
  }
  .options{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .opt{
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    font-size:18px;
    color:var(--coral);
    background:transparent;
    border:2px solid var(--coral);
    border-radius:40px;
    padding:16px 10px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .opt:hover{background:rgba(240,100,90,0.08); transform:translateY(-2px);}
  .opt.correct{
    background:var(--good);
    border-color:var(--good);
    color:#fff;
  }
  .opt.wrong{
    background:var(--bad);
    border-color:var(--bad);
    color:#fff;
  }
  .opt:disabled{cursor:default;}
  .opt:disabled:hover{transform:none;}
  .tf-options{
    width:100%;
    display:flex;
    gap:16px;
    justify-content:center;
  }
  .tf-options .opt{flex:1; max-width:180px;}
  .blank-input{
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    font-size:20px;
    color:var(--ink);
    text-align:center;
    border:2px solid var(--sand-dark);
    border-radius:30px;
    padding:14px 20px;
    width:80%;
    max-width:280px;
    margin-bottom:22px;
    background:#fffdf6;
    outline:none;
  }
  .blank-input:focus{border-color:var(--coral);}
  .feedback{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:20px;
    min-height:30px;
    margin-top:18px;
    margin-bottom:6px;
  }
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}
  .next-btn{margin-top:10px; opacity:0; pointer-events:none; transition:opacity .3s;}
  .next-btn.show{opacity:1; pointer-events:auto;}
  .score-circle{
    width:150px;height:150px;
    border-radius:50%;
    background:var(--sea-light);
    border:6px solid var(--sea);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    margin:0 auto 22px;
    box-shadow:0 6px 0 var(--sea-deep);
  }
  .score-num{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:44px; color:var(--sea-deep);}
  .score-label{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .end-msg{font-size:18px; color:var(--ink-soft); margin-bottom:24px; max-width:380px;}
  .icon-row{font-size:34px; margin-bottom:6px;}
  @media (max-width:480px){
    h1.title{font-size:42px;}
    .card{padding:32px 20px 30px;}
    .q-text{font-size:22px;}
    .options{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card" id="card"></div>
</div>

<script>
const QUESTIONS = [
  {
    type: 'mcq',
    badge: 'MULTIPLE CHOICE',
    q: 'What is the colour of the elephant?',
    options: ['orange','grey','black','red'],
    correct: 'grey'
  },
  {
    type: 'mcq',
    badge: 'MULTIPLE CHOICE',
    q: 'What is the colour of the flamingo?',
    options: ['black','pink','white','green'],
    correct: 'pink'
  },
  {
    type: 'fill',
    badge: 'FILL IN THE BLANK',
    q: 'The snake has ……… legs.',
    accept: ['zero','no','none','0'],
  },
  {
    type: 'tf',
    badge: 'TRUE OR FALSE',
    q: 'The tiger is very fast.',
    correct: true
  },
  {
    type: 'tf',
    badge: 'TRUE OR FALSE',
    q: 'The snake is faster than the cheetah.',
    correct: false
  }
];

let current = -1;
let score = 0;
const card = document.getElementById('card');

function renderProgress(){
  let html = '<div class="progress-wrap">';
  QUESTIONS.forEach((_, i)=>{
    html += `<div class="progress-seg ${i < current ? 'filled':''}"></div>`;
  });
  html += '</div>';
  return html;
}

function renderStart(){
  card.innerHTML = `
    <div class="emojis">⭐ 🐚 🏖️ 🐠 ⭐</div>
    <h1 class="title">QUIZ<br>TIME</h1>
    <p class="subtitle">At the Zoo 🦁</p>
    <button class="btn" id="startBtn">Let's Start</button>
  `;
  document.getElementById('startBtn').onclick = ()=>{ current = 0; renderQuestion(); };
}

function renderQuestion(){
  const item = QUESTIONS[current];
  let inner = renderProgress();
  inner += `<div class="badge">${item.badge}</div>`;
  inner += `<p class="q-text">${item.q}</p>`;

  if(item.type === 'mcq'){
    inner += '<div class="options">';
    item.options.forEach(opt=>{
      inner += `<button class="opt" data-val="${opt}">${opt}</button>`;
    });
    inner += '</div>';
  } else if(item.type === 'tf'){
    inner += `<div class="tf-options">
      <button class="opt" data-val="true">True ✅</button>
      <button class="opt" data-val="false">False ❌</button>
    </div>`;
  } else if(item.type === 'fill'){
    inner += `<input type="text" class="blank-input" id="fillInput" placeholder="Type your answer here">
    <div><button class="btn" id="submitFill">Submit</button></div>`;
  }

  inner += `<div class="feedback" id="feedback"></div>`;
  inner += `<button class="btn next-btn" id="nextBtn">التالي</button>`;

  card.innerHTML = inner;

  if(item.type === 'mcq' || item.type === 'tf'){
    document.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick = ()=> handleChoice(btn, item);
    });
  } else if(item.type === 'fill'){
    const input = document.getElementById('fillInput');
    const submit = document.getElementById('submitFill');
    const go = ()=> handleFill(input, submit, item);
    submit.onclick = go;
    input.onkeydown = (e)=>{ if(e.key==='Enter') go(); };
  }
}

function lockOptions(){
  document.querySelectorAll('.opt').forEach(b=> b.disabled = true);
}

function showFeedback(isCorrect, correctText){
  const fb = document.getElementById('feedback');
  if(isCorrect){
    fb.textContent = 'Correct! Well done 🎉';
    fb.className = 'feedback good';
    score++;
  } else {
    fb.textContent = `Not quite, the correct answer is: ${correctText}`;
    fb.className = 'feedback bad';
  }
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.add('show');
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'See Your Score' : 'Next';
  nextBtn.onclick = ()=>{
    current++;
    if(current < QUESTIONS.length){ renderQuestion(); }
    else { renderEnd(); }
  };
}

function handleChoice(btn, item){
  if(btn.disabled) return;
  lockOptions();
  const val = btn.dataset.val;
  let isCorrect, correctText;
  if(item.type === 'tf'){
    isCorrect = (val === String(item.correct));
    correctText = item.correct ? 'True ✅' : 'False ❌';
  } else {
    isCorrect = (val === item.correct);
    correctText = item.correct;
  }
  document.querySelectorAll('.opt').forEach(b=>{
    const bVal = b.dataset.val;
    const bIsCorrect = item.type==='tf' ? (bVal === String(item.correct)) : (bVal === item.correct);
    if(bIsCorrect) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
  });
  showFeedback(isCorrect, correctText);
}

function handleFill(input, submit, item){
  submit.disabled = true;
  input.disabled = true;
  const val = input.value.trim().toLowerCase();
  const isCorrect = item.accept.some(a => val === a.toLowerCase());
  input.style.borderColor = isCorrect ? 'var(--good)' : 'var(--bad)';
  showFeedback(isCorrect, 'zero (it has no legs at all)');
}

function renderEnd(){
  const total = QUESTIONS.length;
  let msg;
  if(score === total) msg = 'Perfect score! You\'re a real zoo expert 🦁';
  else if(score >= total/2) msg = 'Nice work! A little more practice and you\'ll ace it 🌊';
  else msg = 'No worries, give it another go and you\'ll improve 💪';

  card.innerHTML = `
    <div class="icon-row">🏆</div>
    <h1 class="title" style="font-size:44px;">GREAT<br>JOB!</h1>
    <div class="score-circle">
      <div class="score-num">${score}/${total}</div>
      <div class="score-label">Correct Answers</div>
    </div>
    <p class="end-msg">${msg}</p>
    <button class="btn" id="restartBtn">THE END - Play Again</button>
  `;
  document.getElementById('restartBtn').onclick = ()=>{
    current = -1; score = 0; renderStart();
  };
}

// decorative floating dots
(function addDots(){
  const positions = [
    {top:'5%',left:'8%',size:10},
    {top:'12%',left:'85%',size:14},
    {top:'70%',left:'6%',size:8},
    {top:'80%',left:'90%',size:12},
    {top:'40%',left:'92%',size:6},
    {top:'55%',left:'4%',size:6}
  ];
  positions.forEach(p=>{
    const d = document.createElement('div');
    d.className = 'bg-dot';
    d.style.top = p.top;
    d.style.left = p.left;
    d.style.width = p.size+'px';
    d.style.height = p.size+'px';
    document.body.appendChild(d);
  });
})();

renderStart();
</script>
</body>
</html>
